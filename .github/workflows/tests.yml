name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Standard library only: nothing to install. The real aim-test window stays off (OSU_TABLET_GUI_TESTS unset).
      - name: Run the tests
        run: python -m unittest discover -s tests
