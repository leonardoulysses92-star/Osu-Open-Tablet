[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osu-tablet-assistant"
version = "0.1.0"
description = "Guided OpenTabletDriver setup assistant for osu! players: finds good area and filter settings for any tablet."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
osu-tablet-assistant = "osu_tablet_assistant.__main__:main"

[tool.setuptools.packages.find]
include = ["osu_tablet_assistant*"]

[tool.setuptools.package-data]
osu_tablet_assistant = ["knowledge/*.json", "locales/*/*.json"]
